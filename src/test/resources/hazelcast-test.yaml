hazelcast:
  instance-name: eligibility-hz-test
  cluster-name: test-cluster
  network:
    join:
      multicast:
        enabled: false
      tcp-ip:
        enabled: true
        member-list:
          - 127.0.0.1
      kubernetes:
        enabled: false
    port:
      auto-increment: true
      port: 5701
  map:
    eligibility:
      time-to-live-seconds: 60
      backup-count: 0
