server:
  port: 8083
spring:
  application:
    name: eligibility
  cache:
    type: hazelcast
hazelcast:
  config: classpath:hazelcast.yaml
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
logging:
  level:
    root: INFO
    com.example.eligibility: DEBUG
    org.springframework.cache: DEBUG
    com.hazelcast: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/eligibility.log
    max-size: 10MB
    max-history: 30
