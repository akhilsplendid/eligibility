hazelcast:
  instance-name: eligibility-hz-local
  cluster-name: eligibility-cluster
  network:
    join:
      multicast:
        enabled: false
      tcp-ip:
        enabled: true
        member-list:
          - 127.0.0.1
    port:
      auto-increment: true
      port: 5701
  map:
    eligibility:
      time-to-live-seconds: 60
      backup-count: 0
      async-backup-count: 0
      max-idle-seconds: 300
      eviction:
        eviction-policy: LRU
        max-size-policy: PER_NODE
        size: 10000
  management-center:
    scripting-enabled: false
    console-enabled: true
